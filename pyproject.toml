[project]
name = "roomscope"
version = "0.1.0"
description = "Phone capture (photos / video / LiDAR) -> dimensioned, stitched floor plan with damage scope and calibrated intervals"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.24",
  "opencv-python>=4.9",
  "open3d>=0.18",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "pillow>=10.0",
  "typer>=0.12",
  "pillow-heif>=0.16",
]

[project.optional-dependencies]
models = ["torch>=2.3", "torchvision", "huggingface_hub", "anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
roomscope = "roomscope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomscope"]

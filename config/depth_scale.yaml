# LiDAR depth scale a = measured / true (depth is divided by a at load time), per device.
# Measured per pixel against Faro-laser-rendered depth (src/roomscope/eval/depth_bias.py).
# Held-out rule: the iPad value is fitted on 42444949 + 42444950 only; 42444946 is the scored scene.
#
# Interval rule (core/calibrate.py): the conformal intervals were fitted on captures from
# `calibration_device`, so they already contain that device's residual scale error. For any other
# device, the EXCESS scale uncertainty sqrt(se^2 - se_cal^2) is added to every length, height and area.
calibration_device: "iPad Pro (2020)"
devices:
  "iPad Pro (2020)":
    scale: 0.9883        # -1.17%: median of -1.10% (42444949) and -1.23% (42444950)
    se: 0.0011           # sd of the three laser-measured captures (-1.10, -1.23, -1.31% incl. held-out 42444946)
    source: "ARKitScenes iPad Pro (2020) LiDAR, Faro reference, captures 42444949+42444950"
  "iPhone 12 Pro Max (Polycam depth)":
    scale: 0.9968        # -0.32%: median of 6 opposite-wall distances vs the Faro laser, uncorrected depth
    se: 0.0013           # 1.4826 x MAD of the 6 ratios
    source: "MuSHRoom vr_room (long + short) vs Faro laser; held out from the head-to-head rooms (bench/depth_scale_walls.py)"
  # more entries are written by `roomscope calibrate-depth` from one tape-measured reference per phone
# A phone with no entry (or not named: Stray exports do not record the model). Assumption, not a
# measurement: Apple's Pro iPhones and iPads share the same class of dToF LiDAR module, so the centre is
# the only measured value; se 1% says the per-device offset is unknown to about +-1.6% (90%).
default:
  scale: 0.9883
  se: 0.010
  source: "unknown device: iPad Pro (2020) centre, 1% device-to-device prior (assumed, not measured)"
